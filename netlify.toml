# Netlify — Uniquworld client (Vite SPA)
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: all routes → index.html (fixes Page not found on refresh)
# Hostinger uploads: also ship dist/_redirects + dist/.htaccess from client/public/
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
