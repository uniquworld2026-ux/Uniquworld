# If Netlify base directory is set to `client`, this file is used instead.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (also mirrored in public/_redirects + public/.htaccess for Hostinger)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
